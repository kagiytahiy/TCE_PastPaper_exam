<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國民小學教師檢定題庫系統 - 靜宜大學</title>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f5f5f4; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .soft-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); }
        .bg-glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        
        @media print {
            body { background: white !important; }
            .print-hidden { display: none !important; }
            .print-break-inside-avoid { break-inside: avoid; }
        }
    </style>
</head>
<body class="antialiased text-stone-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const loadFirebaseModule = new Function('url', 'return import(url)');
        
        const MY_FIREBASE_CONFIG = {
            apiKey: "AIzaSyDnsnTr2JqLx3gPvZ1WduedNtFRvMsdmzk",
            authDomain: "tce-elementary-school.firebaseapp.com",
            projectId: "tce-elementary-school",
            storageBucket: "tce-elementary-school.firebasestorage.app",
            messagingSenderId: "881960368020",
            appId: "1:881960368020:web:2f084c67db7b39cfcfc181"
        };

        const SUBJECTS = [
            { id: 'TC', name: '國語文能力測驗', icon: '📖' },
            { id: 'EP', name: '教育理念與實務', icon: '🌱' },
            { id: 'TM', name: '數學能力測驗', icon: '📐' },
            { id: 'CIA', name: '課程教學與評量', icon: '📝' },
            { id: 'TDAC', name: '學習者發展與適性輔導', icon: '🧠' }
        ];

        const YEARS = ['115', '114', '113', '112', '111', '110', '109', '108-2', '108-1', '107', '106', '105'];

        // 🚀 核心：強效記憶吐司 Hook (即使 F5 重新整理也能保留狀態)
        const useStickyState = (defaultValue, key) => {
            const [value, setValue] = useState(() => {
                try {
                    const stickyValue = sessionStorage.getItem(key);
                    return stickyValue !== null ? JSON.parse(stickyValue) : defaultValue;
                } catch (e) {
                    return defaultValue;
                }
            });
            useEffect(() => {
                try {
                    sessionStorage.setItem(key, JSON.stringify(value));
                } catch (e) {}
            }, [key, value]);
            return [value, setValue];
        };

        const hasRealContent = (str) => {
            if (!str) return false;
            const s = String(str).replace(/[\s\u3000]+/g, '');
            if (s === '' || s === '無' || s === '無圖' || s.toLowerCase() === 'none') return false;
            return true;
        };

        const isImageFile = (str) => {
            if (typeof str !== 'string') return false;
            return /\.(png|jpe?g|gif|webp|svg)$/i.test(str.trim());
        };

        const SmartImage = ({ src }) => {
            if (!hasRealContent(src)) return null;
            const sources = String(src).split(/[;,]/).map(s => s.trim()).filter(hasRealContent);
            if (sources.length === 0) return null;

            return (
                <div className="w-full flex flex-col items-center gap-4 my-4">
                    {sources.map((s, i) => {
                        const imgSrc = s.startsWith('http') ? s : `./${s}`;
                        return (
                            <div key={i} className="relative group rounded-xl overflow-visible border-2 border-stone-200 shadow-sm inline-block max-w-full bg-white z-10 hover:z-50 print:border-none print:shadow-none print:my-2">
                                <img src={imgSrc} alt={`附圖 ${i+1}`} 
                                     className="max-w-full h-auto object-contain max-h-96 transition-transform duration-300 ease-in-out group-hover:scale-[1.75] origin-top md:origin-top-left cursor-zoom-in" 
                                     onError={(e) => {
                                         e.target.style.display = 'none';
                                         e.target.parentElement.innerHTML = `<div class="p-4 bg-rose-50 text-rose-500 text-sm font-bold flex items-center gap-2"><span>🖼️</span>圖檔載入失敗: ${s}</div>`;
                                     }} />
                                {sources.length > 1 && <div className="bg-stone-100 text-stone-500 text-xs font-bold text-center py-1 border-t border-stone-200 print:hidden">附圖 {i + 1}</div>}
                            </div>
                        );
                    })}
                </div>
            );
        };

        const AdminAuthModal = ({ onClose, onSuccess }) => {
            const [pwd, setPwd] = useState('');
            const [err, setErr] = useState('');
            const inputRef = useRef(null);
            
            useEffect(() => { if(inputRef.current) inputRef.current.focus(); }, []);

            const handleSubmit = () => {
                if(pwd === '660828') { onSuccess(); onClose(); }
                else setErr('密碼錯誤，請重新輸入');
            };

            return (
                <div className="fixed inset-0 bg-black/60 z-[200] flex items-center justify-center backdrop-blur-sm animate-fadeIn p-4">
                    <div className="bg-white p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-sm">
                        <div className="text-4xl text-center mb-4">🔐</div>
                        <h3 className="text-xl font-black mb-2 text-center text-stone-800">題庫管理員登入</h3>
                        <input type="password" value={pwd} ref={inputRef} onChange={e => { setPwd(e.target.value); setErr(''); }} onKeyDown={e => e.key === 'Enter' && handleSubmit()} placeholder="請輸入密碼..." className="w-full border-2 border-stone-200 p-4 rounded-xl mb-2 focus:border-amber-500 outline-none text-center font-bold tracking-widest text-lg" />
                        {err && <p className="text-rose-500 text-sm font-bold mb-4 text-center animate-pulse">{err}</p>}
                        {!err && <div className="h-6 mb-4"></div>}
                        <div className="flex gap-3 mt-2">
                            <button onClick={onClose} className="flex-1 py-3 rounded-xl bg-stone-100 text-stone-600 hover:bg-stone-200 font-black transition-colors">取消</button>
                            <button onClick={handleSubmit} className="flex-1 py-3 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-black transition-colors shadow-md">登入</button>
                        </div>
                    </div>
                </div>
            )
        };

        const DropdownMenu = ({ readySubjects, fetchAvailableYears, onAdminClick }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="fixed top-4 left-4 z-[300] print:hidden">
                    <button onClick={() => setIsOpen(!isOpen)} className="bg-[#543b24]/90 backdrop-blur hover:bg-[#3d2918] px-3.5 py-2 rounded-xl font-bold text-sm border border-[#856341] text-white flex items-center gap-2 shadow-2xl transition-all hover:scale-105">
                        <span>☰ 選單</span>
                    </button>
                    {isOpen && (
                        <div className="absolute top-full left-0 mt-2 w-64 bg-white rounded-2xl shadow-2xl border border-stone-200 overflow-hidden text-left animate-fadeIn">
                            <div className="bg-[#f5ece1] px-4 py-2 text-xs font-black text-[#8c6b4a] tracking-widest">📚 快速切換科目</div>
                            {SUBJECTS.map(sub => {
                                const isUnlocked = readySubjects[sub.id];
                                return (
                                    <button key={sub.id} onClick={() => { if(isUnlocked){ setIsOpen(false); fetchAvailableYears(sub); } }} className={`w-full text-left px-4 py-3 flex items-center gap-3 hover:bg-stone-50 border-b border-stone-100 transition-colors ${!isUnlocked && 'opacity-50 cursor-not-allowed'}`}>
                                        <span className="text-xl">{sub.icon}</span>
                                        <span className="font-bold text-stone-700 text-sm">{sub.name}</span>
                                        {!isUnlocked && <span className="ml-auto text-xs bg-stone-200 text-stone-500 px-2 py-0.5 rounded">未開放</span>}
                                    </button>
                                );
                            })}
                            <div className="bg-[#f5ece1] px-4 py-2 text-xs font-black text-[#8c6b4a] tracking-widest mt-1">⚙️ 系統管理</div>
                            <button onClick={() => { setIsOpen(false); onAdminClick(); }} className="w-full text-left px-4 py-3 font-bold text-stone-700 text-sm hover:bg-stone-50 border-b border-stone-100 flex items-center gap-3">
                                <span className="text-xl">🔐</span> 題庫管理後台
                            </button>
                            <div className="bg-stone-50 px-4 py-4 border-t border-stone-200">
                                <div className="text-xs font-bold text-stone-500 mb-1">👨‍💻 聯絡管理員</div>
                                <a href="mailto:kagiytahiy@gmail.com" className="text-sm font-black text-amber-600 hover:text-amber-700 break-all flex items-center gap-2 transition-colors">
                                    📧 kagiytahiy@gmail.com
                                </a>
                            </div>
                        </div>
                    )}
                    {isOpen && <div className="fixed inset-0 z-[-1]" onClick={() => setIsOpen(false)}></div>}
                </div>
            );
        };

        const QuestionContent = React.memo(({ q, idx, showBlock, showGroup, isReviewMode, answers, setAnswers, markedQuestions, toggleMark }) => {
            const isMarked = markedQuestions[q.id];
            
            const blockDisplay = showBlock ? (
                <div className="bg-[#fbf8f3]/90 backdrop-blur border-l-4 border-amber-600 p-4 mb-4 rounded-r-lg shadow-sm print:bg-transparent print:border-black print:shadow-none print:mt-6">
                    <div className="font-black text-amber-800 text-sm mb-1 flex items-center gap-2 print:text-black">
                        <span className="print-hidden">📖</span> 【作答說明】
                    </div>
                    <div className="text-stone-700 leading-relaxed text-sm whitespace-pre-wrap print:text-black" dangerouslySetInnerHTML={{ __html: String(q.block || '') }}></div>
                </div>
            ) : null;

            const groupDisplay = (showGroup && hasRealContent(q.group)) ? (
                <div className="bg-emerald-50/90 backdrop-blur border border-emerald-200 p-4 mb-4 rounded-xl shadow-sm text-sm text-emerald-900 print:bg-transparent print:border-black print:shadow-none">
                    <div className="font-black mb-1 flex items-center gap-2 print:text-black"><span className="print-hidden">🏷️</span>【題組情境】</div>
                    <div className="whitespace-pre-wrap print:text-black" dangerouslySetInnerHTML={{ __html: String(q.group || '') }}></div>
                </div>
            ) : null;

            const renderOptionContent = (optVal) => {
                if (!optVal) return null;
                const parts = String(optVal).split(/[;,]/).map(s => s.trim()).filter(hasRealContent);
                const allImages = parts.length > 0 && parts.every(isImageFile);
                if (allImages) {
                    return (
                        <div className="flex gap-3 flex-wrap">
                            {parts.map((p, i) => <img key={i} src={p.startsWith('http') ? p : `./${p}`} alt={`選項圖片`} className="max-h-24 object-contain rounded-md shadow-sm border border-stone-200 transition-transform duration-300 hover:scale-[1.75] origin-left z-10 hover:z-50 relative bg-white cursor-zoom-in print:border-none print:shadow-none" />)}
                        </div>
                    );
                } else return <span className="pt-0.5 whitespace-pre-wrap" dangerouslySetInnerHTML={{ __html: String(optVal || '') }} />;
            };

            const showABCD = q.options && q.options.length > 0;

            return (
                <div className="mb-6 print-break-inside-avoid">
                    {blockDisplay}
                    {groupDisplay}
                    {q.image && hasRealContent(q.image) && <SmartImage src={q.image} />}
                    
                    <div className="flex items-start gap-2 mb-3 mt-2">
                        <button onClick={() => toggleMark(q.id)} className={`print-hidden shrink-0 text-xl transition-transform hover:scale-110 ${isMarked ? 'text-amber-500' : 'text-stone-300'}`}>
                            {isMarked ? '★' : '☆'}
                        </button>
                        <div className="font-bold text-stone-600 shrink-0 w-8 print:text-black">
                            {idx}. {q.originalYear && <span className="text-[10px] bg-stone-200 text-stone-500 px-1 py-0.5 rounded block mt-1 print:hidden">{q.originalYear}</span>}
                        </div>
                        <div className="text-stone-800 font-medium leading-relaxed flex-grow whitespace-pre-wrap print:text-black" dangerouslySetInnerHTML={{ __html: String(q.text || '') }}></div>
                    </div>

                    {showABCD && (
                        <div className="space-y-2 ml-10">
                            {['A', 'B', 'C', 'D'].map((opt, i) => {
                                if (!q.options || !hasRealContent(q.options[i])) return null;
                                const optValue = q.options[i];
                                const isSelected = answers[q.id] === opt;
                                const isCorrectOpt = isReviewMode && q.answer === opt;
                                const showWrong = isReviewMode && isSelected && !isCorrectOpt;
                                
                                let btnClass = "w-full text-left p-3 md:p-4 rounded-xl border-2 transition-all flex items-start gap-3 text-sm md:text-base print:border print:border-stone-300 print:shadow-none print:bg-transparent print:p-2 ";
                                if (isReviewMode) {
                                    if (isCorrectOpt) btnClass += "bg-emerald-50 border-emerald-500 text-emerald-800 font-bold shadow-md print:border-black print:font-black";
                                    else if (showWrong) btnClass += "bg-rose-50 border-rose-500 text-rose-700 font-bold shadow-sm";
                                    else btnClass += "bg-white/70 border-stone-200 text-stone-400 opacity-60 print:opacity-100 print:text-black";
                                } else {
                                    if (isSelected) btnClass += "bg-amber-100 border-amber-500 text-amber-900 font-bold shadow-sm ring-2 ring-amber-200 ring-offset-1 print:bg-transparent print:border-black";
                                    else btnClass += "bg-white/90 backdrop-blur border-stone-200 text-stone-600 hover:border-amber-400 hover:bg-stone-50 print:text-black";
                                }

                                return (
                                    <button key={opt} disabled={isReviewMode} onClick={() => setAnswers(prev => ({ ...prev, [q.id]: opt }))} className={btnClass}>
                                        <span className={`shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-sm print:border print:border-black ${isSelected ? 'bg-amber-500 text-white print:bg-black print:text-white' : 'bg-stone-200 text-stone-500 print:bg-transparent print:text-black'} ${(isReviewMode && isCorrectOpt) ? '!bg-emerald-500 !text-white print:!bg-black print:!text-white' : ''}`}>
                                            {opt}
                                        </span>
                                        {renderOptionContent(optValue)}
                                    </button>
                                );
                            })}
                        </div>
                    )}

                    {!showABCD && (
                        <div className="ml-10 mt-3">
                            <textarea
                                className="w-full p-4 border-2 border-stone-200 bg-white/90 backdrop-blur rounded-xl focus:border-amber-500 outline-none text-stone-700 min-h-[120px] print:border-black print:bg-transparent print:shadow-none print:text-black"
                                placeholder={isReviewMode ? "您的作答（僅供參考，不計分）" : "請在此輸入您的草稿或解答..."}
                                value={answers[q.id] || ''}
                                onChange={(e) => !isReviewMode && setAnswers(prev => ({...prev, [q.id]: e.target.value}))}
                                disabled={isReviewMode}
                            />
                        </div>
                    )}

                    {isReviewMode && (
                        <div className="mt-4 ml-10 p-4 bg-white/90 backdrop-blur rounded-xl border border-stone-200 text-sm text-stone-700 print:bg-transparent print:border-dashed print:border-black">
                            <div className="font-black text-stone-800 mb-2 flex items-center gap-2 print:text-black"><span className="print-hidden">📝</span> 官方解答 / 解析</div>
                            {showABCD && <div className="mb-2">正確答案：<strong className="text-emerald-600 text-lg print:text-black">{q.answer}</strong></div>}
                            <div className="whitespace-pre-wrap print:text-black" dangerouslySetInnerHTML={{ __html: String(q.explanation || q.method || '（無提供解析）') }}></div>
                        </div>
                    )}
                </div>
            );
        });

        const AdminPanel = ({ setView, firestoreDb, stats, setStats, onLogout }) => {
            const [uploadYear, setUploadYear] = useState('114');
            const [uploadSubject, setUploadSubject] = useState('TC');
            const [file, setFile] = useState(null);
            const [isUploading, setIsUploading] = useState(false);
            const [logs, setLogs] = useState([]);

            const addLog = (message, type = "info") => setLogs(prev => [...prev, { time: new Date().toLocaleTimeString(), message, type }]);

            const handleResetStats = async () => {
                const pwd = window.prompt("⚠️ 警告：這將會清空所有造訪人次記錄。\n請輸入歸零密碼：");
                if (pwd === '660828') {
                    try {
                        const { doc, setDoc } = await loadFirebaseModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
                        const d = new Date();
                        const dateString = d.toLocaleDateString();
                        const monthString = `${d.getFullYear()}-${d.getMonth() + 1}`;
                        const monday = new Date(d);
                        monday.setDate(monday.getDate() - (d.getDay() || 7) + 1);
                        const weekString = monday.toLocaleDateString();
                        
                        const resetData = { today: 0, week: 0, month: 0, total: 0, dateString, weekString, monthString };
                        await setDoc(doc(firestoreDb, 'system', 'stats'), resetData);
                        setStats(resetData);
                        addLog('✅ 計數器已成功歸零！', 'success');
                        alert('✅ 計數器已成功歸零！');
                    } catch(e) {
                        addLog('❌ 歸零失敗: ' + e.message, 'error');
                        alert('❌ 歸零失敗，請檢查網路連線或權限。');
                    }
                } else if (pwd !== null) {
                    alert('❌ 密碼錯誤，拒絕歸零。');
                }
            };

            const startUpload = () => {
                if (!file) return alert("請先選擇 Excel 檔案！");
                if (!confirm(`警告！您即將上傳至 ${uploadYear}年度 ${SUBJECTS.find(s=>s.id===uploadSubject).name}。`)) return;

                setIsUploading(true);
                addLog(`開始讀取 Excel 檔案...`);

                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                        const excelData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                        const { doc, setDoc } = await loadFirebaseModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
                        const collectionName = `exams_${uploadYear}_${uploadSubject}`;

                        let currentBlock = ""; 

                        for (const row of excelData) {
                            const rawType = String(row['題型'] || '');
                            let qType = 'mcq';
                            
                            if (rawType.includes('寫作') || rawType.includes('作文')) qType = 'writing';
                            else if (rawType.includes('綜合')) qType = 'comprehensive';
                            else if (rawType.includes('問答') || rawType.includes('非選')) qType = 'non_mcq';
                            else if (rawType.includes('選擇') || rawType.includes('題組')) qType = 'mcq';
                            else if (!row['選項A']) qType = 'non_mcq';

                            const qId = String(row['題號'] || `item_${Math.random().toString(36).substr(2, 5)}`);
                            const rowBlock = row['區塊內容'] || row['區塊說明'] || row['作答說明'] || row['說明'];
                            
                            if (hasRealContent(rowBlock)) {
                                currentBlock = rowBlock; 
                            } else if (rowBlock !== undefined && rowBlock !== null) {
                                const cleanStr = String(rowBlock).replace(/[\s\u3000]+/g, '').toLowerCase();
                                if (cleanStr === '無' || cleanStr === 'none' || cleanStr === '無圖') currentBlock = ""; 
                            }

                            const item = {
                                id: qId, type: qType, rawType: rawType, text: row['題目'] || "", image: row['圖片'] || "",
                                block: currentBlock, group: row['題組'] || ""
                            };

                            if (hasRealContent(row['選項A']) || hasRealContent(row['選項B'])) {
                                item.options = [row['選項A'], row['選項B'], row['選項C'], row['選項D']].filter(hasRealContent);
                                item.answer = String(row['正確/參考答案'] || "").trim().toUpperCase();
                            }
                            item.explanation = row['詳解/評分標準'] || ""; item.method = row['詳解/評分標準'] || "";

                            await setDoc(doc(firestoreDb, collectionName, item.id), item);
                            addLog(`寫入: 第 ${item.id} 題 (${qType})`, "success");
                        }
                        addLog(`🎉 批次上傳完成！返回前台即可看到。`, "success");
                    } catch (err) { addLog("錯誤: " + err.message, "error"); }
                    setIsUploading(false);
                };
                reader.readAsArrayBuffer(file);
            };

            const deleteYearData = async () => {
                if (!confirm(`危險！確定要刪除「${uploadYear}年度 ${SUBJECTS.find(s=>s.id===uploadSubject).name}」的所有題目嗎？`)) return;
                setIsUploading(true);
                try {
                    const { collection, getDocs, deleteDoc } = await loadFirebaseModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
                    const snap = await getDocs(collection(firestoreDb, `exams_${uploadYear}_${uploadSubject}`));
                    let count = 0;
                    for (const d of snap.docs) { await deleteDoc(d.ref); count++; }
                    addLog(`🗑️ 成功刪除 ${count} 筆資料`, "success");
                } catch(e) { addLog("刪除失敗: " + e.message, "error"); }
                setIsUploading(false);
            };

            return (
                <div className="flex-grow p-4 sm:p-8 max-w-4xl mx-auto w-full relative z-10 animate-fadeIn pt-16 md:pt-20">
                    <header className="flex justify-between items-center mb-6 bg-white/80 p-4 rounded-2xl shadow-sm backdrop-blur">
                        <h1 className="text-xl md:text-2xl font-black text-amber-700">⚙️ 題庫批次管理後台</h1>
                        <div className="flex gap-2">
                            <button onClick={() => setView('home')} className="bg-stone-800 hover:bg-stone-700 text-white px-4 md:px-5 py-2.5 rounded-xl font-bold shadow-md transition-all text-sm md:text-base">◀ 回前台</button>
                            <button onClick={onLogout} className="bg-rose-50 hover:bg-rose-100 text-rose-600 px-4 md:px-5 py-2.5 rounded-xl font-bold shadow-sm transition-all border border-rose-200 text-sm md:text-base">登出</button>
                        </div>
                    </header>

                    <div className="mb-8">
                        <div className="flex justify-between items-center mb-4 px-2">
                            <h2 className="text-lg font-black text-stone-700">📊 系統造訪人次統計</h2>
                            <button onClick={handleResetStats} className="bg-rose-50 hover:bg-rose-100 text-rose-600 px-4 py-2 rounded-xl font-bold text-sm shadow-sm transition-colors border border-rose-200 flex items-center gap-2">
                                <span>🔄</span> 計數器歸零
                            </button>
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div className="bg-white/95 p-4 rounded-2xl soft-shadow text-center border border-stone-200">
                                <div className="text-stone-500 text-sm font-bold mb-1">今日造訪</div>
                                <div className="text-3xl font-black text-amber-600">{stats.today}</div>
                            </div>
                            <div className="bg-white/95 p-4 rounded-2xl soft-shadow text-center border border-stone-200">
                                <div className="text-stone-500 text-sm font-bold mb-1">本週造訪</div>
                                <div className="text-3xl font-black text-amber-600">{stats.week}</div>
                            </div>
                            <div className="bg-white/95 p-4 rounded-2xl soft-shadow text-center border border-stone-200">
                                <div className="text-stone-500 text-sm font-bold mb-1">本月造訪</div>
                                <div className="text-3xl font-black text-amber-600">{(stats.month).toLocaleString()}</div>
                            </div>
                            <div className="bg-white/95 p-4 rounded-2xl soft-shadow text-center border border-stone-200">
                                <div className="text-stone-500 text-sm font-bold mb-1">累積總數</div>
                                <div className="text-3xl font-black text-emerald-600">{(stats.total).toLocaleString()}</div>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white/95 backdrop-blur p-8 rounded-3xl soft-shadow border border-stone-200 mb-8">
                        <div className="grid grid-cols-2 gap-4 mb-6">
                            <div>
                                <label className="block text-sm font-black text-rose-600 mb-2">⚠️ 1. 選擇年份</label>
                                <select onChange={e => setUploadYear(e.target.value)} value={uploadYear} className="w-full p-4 border-2 border-rose-200 bg-rose-50 rounded-xl font-bold">
                                    {YEARS.map(y => <option key={y} value={y}>{y}年度</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-black text-indigo-600 mb-2">2. 選擇科目</label>
                                <select onChange={e => setUploadSubject(e.target.value)} value={uploadSubject} className="w-full p-4 border-2 border-indigo-200 bg-indigo-50 rounded-xl font-bold">
                                    {SUBJECTS.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                </select>
                            </div>
                        </div>
                        <input type="file" accept=".xlsx, .xls" onChange={e => setFile(e.target.files[0])} className="block w-full text-stone-600 file:mr-4 file:py-3 file:px-6 file:rounded-xl file:border-0 file:bg-stone-200 hover:file:bg-stone-300 cursor-pointer mb-6" />
                        <div className="flex gap-4">
                            <button onClick={startUpload} disabled={isUploading} className="flex-1 font-black text-lg py-4 rounded-xl bg-emerald-600 text-white hover:bg-emerald-700 shadow-lg">🚀 寫入資料庫</button>
                            <button onClick={deleteYearData} disabled={isUploading} className="px-6 py-4 rounded-xl font-black text-rose-600 bg-white border-2 border-rose-200 hover:bg-rose-50">🗑️ 刪除此年份</button>
                        </div>
                    </div>
                    <div className="bg-stone-900/95 p-6 rounded-2xl shadow-inner border border-stone-800 h-64 overflow-y-auto font-mono text-sm space-y-1">
                        {logs.map((l, i) => <div key={i} className={l.type === 'error' ? 'text-rose-400' : (l.type === 'success' ? 'text-emerald-400' : 'text-stone-300')}>[{l.time}] {l.message}</div>)}
                    </div>
                </div>
            );
        };

        const App = () => {
            // 🚀 套用記憶吐司 Hook：讓重新整理不會迷路
            const [view, setView] = useStickyState('home', 'tce_view'); 
            const [selectedSubject, setSelectedSubject] = useStickyState(null, 'tce_selectedSubject');
            const [availableYears, setAvailableYears] = useStickyState([], 'tce_availableYears');
            const [yearMode, setYearMode] = useStickyState('single', 'tce_yearMode');
            const [selectedRandomYears, setSelectedRandomYears] = useStickyState([], 'tce_selectedRandomYears');
            const [selectedYear, setSelectedYear] = useStickyState('', 'tce_selectedYear');
            const [examData, setExamData] = useStickyState([], 'tce_examData');
            const [answers, setAnswers] = useStickyState({}, 'tce_answers');
            const [isReviewMode, setIsReviewMode] = useStickyState(false, 'tce_isReviewMode');
            const [timeLeft, setTimeLeft] = useStickyState(80 * 60, 'tce_timeLeft');
            const [currentTab, setCurrentTab] = useStickyState('mcq', 'tce_currentTab');
            const [currentPage, setCurrentPage] = useStickyState(1, 'tce_currentPage');
            const [markedQuestions, setMarkedQuestions] = useStickyState({}, 'tce_markedQuestions');
            const [readySubjects, setReadySubjects] = useStickyState({}, 'tce_readySubjects');
            
            const [showAuth, setShowAuth] = useState(false);
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(() => sessionStorage.getItem('adminAuth') === 'true');
            const [isPrinting, setIsPrinting] = useState(false);
            const [firestoreDb, setFirestoreDb] = useState(null);
            const [stats, setStats] = useState({ today: 0, week: 0, month: 0, total: 0 });
            
            const topRef = useRef(null);
            const ITEMS_PER_MCQ_PAGE = 5;

            const toggleMark = (qId) => setMarkedQuestions(prev => ({...prev, [qId]: !prev[qId]}));

            const handleAdminAccess = () => isAdminLoggedIn ? setView('admin') : setShowAuth(true);

            const handleLogout = () => {
                setIsAdminLoggedIn(false);
                sessionStorage.removeItem('adminAuth');
                setView('home');
            };

            useEffect(() => {
                const initFirebase = async () => {
                    try {
                        const fbApp = await loadFirebaseModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js');
                        const fbAuth = await loadFirebaseModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js');
                        const fbFirestore = await loadFirebaseModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
                        const app = fbApp.initializeApp(MY_FIREBASE_CONFIG);
                        const db = fbFirestore.getFirestore(app);
                        setFirestoreDb(db);
                        await fbAuth.signInAnonymously(fbAuth.getAuth(app));

                        try {
                            const { doc, getDoc, setDoc } = fbFirestore;
                            const statsRef = doc(db, 'system', 'stats');
                            const snap = await getDoc(statsRef);
                            const d = new Date();
                            const dateString = d.toLocaleDateString();
                            const monthString = `${d.getFullYear()}-${d.getMonth() + 1}`;
                            const monday = new Date(d);
                            monday.setDate(monday.getDate() - (d.getDay() || 7) + 1);
                            const weekString = monday.toLocaleDateString();

                            let currentStats = snap.exists() ? snap.data() : { today: 0, week: 0, month: 0, total: 0, dateString, weekString, monthString };
                            
                            if (currentStats.dateString !== dateString) currentStats.today = 0;
                            if (currentStats.weekString !== weekString) currentStats.week = 0;
                            if (currentStats.monthString !== monthString) currentStats.month = 0;

                            if (!sessionStorage.getItem('visited')) {
                                sessionStorage.setItem('visited', 'true');
                                currentStats.today += 1;
                                currentStats.week += 1;
                                currentStats.month += 1;
                                currentStats.total += 1;
                                currentStats.dateString = dateString;
                                currentStats.weekString = weekString;
                                currentStats.monthString = monthString;
                                await setDoc(statsRef, currentStats);
                            }
                            setStats(currentStats);
                        } catch (err) { console.error("計數器系統讀取失敗", err); }
                    } catch (error) {}
                };
                initFirebase();
            }, []);

            useEffect(() => {
                if (firestoreDb) {
                    const scanSubjects = async () => {
                        const { collection, query, limit, getDocs } = await loadFirebaseModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
                        const newReady = {};
                        for (let sub of SUBJECTS) {
                            for(let y of YEARS) {
                                try {
                                    const snap = await getDocs(query(collection(firestoreDb, `exams_${y}_${sub.id}`), limit(1)));
                                    if (!snap.empty) { newReady[sub.id] = true; break; }
                                } catch(e) {}
                            }
                        }
                        setReadySubjects(newReady);
                    };
                    scanSubjects();
                }
            }, [firestoreDb]);

            useEffect(() => {
                let timer;
                if (view === 'exam' && !isReviewMode && !isPrinting && timeLeft > 0) {
                    timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                } else if (timeLeft === 0 && view === 'exam' && !isReviewMode) {
                    submitExam();
                }
                return () => clearInterval(timer);
            }, [view, isReviewMode, isPrinting, timeLeft]);

            const fetchAvailableYears = async (subject) => {
                setSelectedSubject(subject);
                setView('years');
                setYearMode('single');
                setSelectedRandomYears([]);
                if (!firestoreDb) return;
                
                const { collection, getDocs, query, limit } = await loadFirebaseModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
                const yearsFound = [];
                for (let y of YEARS) {
                    try {
                        const snap = await getDocs(query(collection(firestoreDb, `exams_${y}_${subject.id}`), limit(1)));
                        if (!snap.empty) yearsFound.push(y);
                    } catch(e) {}
                }
                setAvailableYears(yearsFound);
            };

            const setupExamState = (questions, isRandom = false) => {
                setExamData(questions);
                setAnswers({});
                setMarkedQuestions({});
                setIsReviewMode(false);
                setTimeLeft(80 * 60);
                setCurrentPage(1);
                
                if(questions.some(q => q.type === 'mcq')) setCurrentTab('mcq');
                else if(questions.some(q => q.type === 'comprehensive')) setCurrentTab('comprehensive');
                else if(questions.some(q => q.type === 'non_mcq')) setCurrentTab('non_mcq');
                else if(questions.some(q => q.type === 'writing')) setCurrentTab('writing');
                
                setView('exam');
            };

            const startExam = async (year) => {
                setSelectedYear(year);
                if (!firestoreDb) return;
                const { collection, getDocs } = await loadFirebaseModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
                const snap = await getDocs(collection(firestoreDb, `exams_${year}_${selectedSubject.id}`));
                
                const questions = [];
                snap.forEach(doc => questions.push(doc.data()));
                questions.sort((a, b) => {
                    const numA = parseInt(a.id.replace(/\D/g, '')) || 0;
                    const numB = parseInt(b.id.replace(/\D/g, '')) || 0;
                    return numA !== numB ? numA - numB : a.id.localeCompare(b.id);
                });
                setupExamState(questions, false);
            };

            const startRandomExam = async () => {
                if (selectedRandomYears.length === 0 || !firestoreDb) return;
                setSelectedYear(`隨機抽題 (${selectedRandomYears.join(', ')})`);
                
                const { collection, getDocs } = await loadFirebaseModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
                let allQuestions = [];
                
                for (const y of selectedRandomYears) {
                    const snap = await getDocs(collection(firestoreDb, `exams_${y}_${selectedSubject.id}`));
                    snap.forEach(doc => {
                        const data = doc.data();
                        allQuestions.push({ ...data, id: `${y}_${data.id}`, originalYear: y });
                    });
                }
                
                const tempGroups = {};
                let groupCounter = 0;
                const blockToGroupKey = {};

                allQuestions.forEach((q, idx) => {
                    let groupKey = "";
                    const cleanBlock = hasRealContent(q.block) ? q.block.trim() : "";
                    
                    if (hasRealContent(q.group)) {
                        groupKey = `${q.originalYear}_group_${q.group}`;
                    } else if (cleanBlock !== "") {
                        const signature = `${q.originalYear}_${cleanBlock}`;
                        if (!blockToGroupKey[signature]) {
                            groupCounter++;
                            blockToGroupKey[signature] = `${q.originalYear}_block_group_${groupCounter}`;
                        }
                        groupKey = blockToGroupKey[signature];
                    } else {
                        groupKey = `${q.originalYear}_single_${q.id}_${idx}`;
                    }

                    if (!tempGroups[groupKey]) {
                        tempGroups[groupKey] = { type: q.type, questions: [] };
                    }
                    tempGroups[groupKey].questions.push(q);
                });

                const groupedQuestions = { mcq: [], comprehensive: [], writing: [], non_mcq: [] };
                Object.values(tempGroups).forEach(g => {
                    if (groupedQuestions[g.type]) groupedQuestions[g.type].push(g.questions);
                    else groupedQuestions.mcq.push(g.questions);
                });

                const shuffleArray = (arr) => arr.sort(() => Math.random() - 0.5);
                Object.keys(groupedQuestions).forEach(type => {
                    groupedQuestions[type] = shuffleArray(groupedQuestions[type]);
                });

                let finalQuestions = [];

                if (selectedSubject.id === 'TC') {
                    let mcqQuestions = [];
                    let standalones = groupedQuestions.mcq.filter(g => g.length === 1);
                    let realGroups = groupedQuestions.mcq.filter(g => g.length > 1);

                    while (realGroups.length > 0 && mcqQuestions.length < 15) mcqQuestions.push(...realGroups.shift());
                    while (standalones.length > 0 && mcqQuestions.length < 25) mcqQuestions.push(...standalones.shift());
                    while (realGroups.length > 0 && mcqQuestions.length < 25) mcqQuestions.push(...realGroups.shift());
                    
                    finalQuestions.push(...mcqQuestions);
                    finalQuestions.push(...groupedQuestions.comprehensive.slice(0, 2).flat());
                    finalQuestions.push(...groupedQuestions.writing.slice(0, 1).flat());
                } else {
                    Object.values(groupedQuestions).forEach(groups => {
                        groups.forEach(g => finalQuestions.push(...g));
                    });
                }

                const cleanFinalQuestions = finalQuestions.map(q => ({ ...q, block: '' }));
                setupExamState(cleanFinalQuestions, true);
            };

            const submitExam = () => {
                const mcqsAndCompsWithOptions = examData.filter(q => q.type === 'mcq' || (q.type === 'comprehensive' && q.options && q.options.length > 0));
                if (!isReviewMode) {
                    const answeredCount = mcqsAndCompsWithOptions.filter(q => answers[q.id]).length;
                    if (answeredCount < mcqsAndCompsWithOptions.length) {
                        if (!confirm(`您還有 ${mcqsAndCompsWithOptions.length - answeredCount} 題選擇題(含綜合)未作答，確定要提早交卷嗎？`)) return;
                    }
                }
                setIsReviewMode(true);
                setView('result');
                window.scrollTo(0, 0);
            };

            const handlePrint = () => {
                setIsPrinting(true);
                setTimeout(() => {
                    window.print();
                    setIsPrinting(false);
                }, 500);
            };

            return (
                <div className="min-h-screen flex flex-col relative text-stone-800 print:bg-white print:text-black">
                    {!isPrinting && <div className="fixed inset-0 z-[-2] bg-center bg-cover bg-fixed bg-no-repeat print:hidden" style={{ backgroundImage: "url('PU_Catholic_church.jpg')" }}></div>}
                    {!isPrinting && <div className="fixed inset-0 z-[-1] bg-white/65 print:hidden"></div>}

                    <DropdownMenu readySubjects={readySubjects} fetchAvailableYears={fetchAvailableYears} onAdminClick={handleAdminAccess} />

                    {showAuth && !isPrinting && <AdminAuthModal onClose={() => setShowAuth(false)} onSuccess={() => {
                        setIsAdminLoggedIn(true);
                        sessionStorage.setItem('adminAuth', 'true');
                        setView('admin');
                        setShowAuth(false);
                    }} />}

                    {}
                    {view === 'home' && !isPrinting && (
                        <div className="flex-grow flex flex-col relative">
                            <header className="relative pt-16 md:pt-20 pb-8 md:pb-12 mb-8">
                                <div className="relative z-10 flex flex-col md:flex-row justify-center items-center gap-4 px-4 pl-24 md:pl-0">
                                    <a href="https://www.pu.edu.tw/" target="_blank" rel="noopener noreferrer" className="block cursor-pointer shrink-0">
                                        <img src="PU_logo.jpg" alt="靜宜大學首頁" className="h-28 md:h-36 w-auto rounded-xl bg-white/95 backdrop-blur p-2 shadow-lg border-2 border-stone-100 object-contain hover:scale-105 transition-all" />
                                    </a>
                                    <h1 className="text-2xl md:text-3xl lg:text-4xl font-black tracking-widest text-stone-800 drop-shadow-md bg-white/60 backdrop-blur-md px-6 py-3 md:py-5 rounded-2xl border border-white shadow-sm text-center">國民小學教師檢定題庫系統</h1>
                                </div>
                            </header>
                            <main className="flex-grow max-w-6xl mx-auto w-full px-4 pt-4 pb-12 relative z-10">
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                    {SUBJECTS.map(sub => {
                                        const isUnlocked = readySubjects[sub.id];
                                        return (
                                            <div key={sub.id} onClick={() => isUnlocked && fetchAvailableYears(sub)} 
                                                className={`relative overflow-hidden rounded-3xl p-6 transition-all duration-300 border-2 ${isUnlocked ? 'bg-glass border-white hover:-translate-y-2 hover:shadow-2xl cursor-pointer soft-shadow group' : 'bg-stone-200/60 backdrop-blur border-stone-300 opacity-60 cursor-not-allowed grayscale'}`}>
                                                <div className="flex justify-between items-start mb-4">
                                                    <span className={`text-4xl md:text-5xl drop-shadow-sm ${isUnlocked ? 'group-hover:scale-110 transition-transform' : ''}`}>{sub.icon}</span>
                                                    {!isUnlocked && <span className="bg-stone-500 text-white text-xs font-bold px-3 py-1 rounded-full shadow-inner">尚未匯入</span>}
                                                    {isUnlocked && <span className="bg-emerald-100 text-emerald-700 text-xs font-black px-3 py-1 rounded-full shadow-sm border border-emerald-200 opacity-0 group-hover:opacity-100 transition-opacity">開放測驗</span>}
                                                </div>
                                                <h2 className="text-xl md:text-2xl font-black text-stone-800 mb-2">{sub.name}</h2>
                                                <p className="text-sm font-medium text-stone-600 leading-relaxed">{isUnlocked ? '單次測驗、多年度智慧隨機抽題模式。' : '等待管理員上傳資料後將自動解鎖。'}</p>
                                            </div>
                                        )
                                    })}
                                </div>
                            </main>
                        </div>
                    )}

                    {view === 'years' && !isPrinting && (
                        <div className="flex-grow flex flex-col relative pt-16 md:pt-20">
                            <main className="flex-grow max-w-5xl mx-auto w-full px-4 pb-8 animate-fadeIn relative z-10">
                                <div className="bg-glass rounded-3xl p-6 md:p-10 soft-shadow border border-white">
                                    <div className="flex items-center gap-3 mb-8 border-b border-stone-200 pb-4 pl-16 md:pl-0">
                                        <button onClick={() => setView('home')} className="bg-[#543b24]/80 hover:bg-[#3d2918] px-4 py-2 rounded-lg font-bold text-sm text-white shadow-sm">◀ 首頁</button>
                                        <h1 className="text-xl md:text-2xl font-black text-stone-800">{selectedSubject.icon} {selectedSubject.name}</h1>
                                    </div>

                                    <div className="flex flex-wrap gap-4 mb-8">
                                        <button onClick={() => setYearMode('single')} className={`px-6 py-3 rounded-full font-black transition-all ${yearMode === 'single' ? 'bg-amber-600 text-white shadow-lg scale-105' : 'bg-stone-100 text-stone-500 hover:bg-stone-200'}`}>1. 歷屆單年度</button>
                                        <button onClick={() => setYearMode('random')} className={`px-6 py-3 rounded-full font-black transition-all ${yearMode === 'random' ? 'bg-amber-600 text-white shadow-lg scale-105' : 'bg-stone-100 text-stone-500 hover:bg-stone-200'}`}>2. 多年度隨機</button>
                                    </div>

                                    {yearMode === 'single' && (
                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 mt-6">
                                            {YEARS.filter(y => availableYears.includes(y)).map(y => (
                                                <button key={y} onClick={() => startExam(y)} className="py-4 rounded-2xl font-black text-lg bg-white text-stone-700 border-2 border-stone-200 hover:border-amber-500 hover:bg-amber-50 shadow-sm hover:-translate-y-1 transition-all">{y} 年度</button>
                                            ))}
                                            {availableYears.length === 0 && <div className="col-span-full py-12 text-center text-stone-500 font-bold">目前本科目尚無資料</div>}
                                        </div>
                                    )}

                                    {yearMode === 'random' && (
                                        <div className="mt-6">
                                            <p className="text-stone-500 text-sm font-bold mb-6 bg-emerald-50 p-4 rounded-xl border border-emerald-100">💡 系統會為您自動分配完美比例（國文科：選擇 25題、綜合 2個題組、寫作 1題）。系統會自動識別並完整保留題組，絕不拆散！</p>
                                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 mb-8">
                                                {YEARS.filter(y => availableYears.includes(y)).map(y => (
                                                    <label key={y} className={`flex items-center gap-3 p-4 rounded-xl border-2 cursor-pointer transition-colors ${selectedRandomYears.includes(y) ? 'border-amber-500 bg-amber-50' : 'border-stone-200 bg-white'}`}>
                                                        <input type="checkbox" checked={selectedRandomYears.includes(y)} onChange={(e) => { if(e.target.checked) setSelectedRandomYears([...selectedRandomYears, y]); else setSelectedRandomYears(selectedRandomYears.filter(item => item !== y)); }} className="w-5 h-5 accent-amber-600" />
                                                        <span className="font-black">{y} 年度</span>
                                                    </label>
                                                ))}
                                            </div>
                                            <button onClick={startRandomExam} disabled={selectedRandomYears.length === 0} className={`px-10 py-4 rounded-full font-black text-lg shadow-xl transition-all border-2 ${selectedRandomYears.length > 0 ? 'bg-amber-600 text-white hover:bg-amber-500 hover:-translate-y-1' : 'bg-stone-300 text-stone-500 cursor-not-allowed'}`}>🎲 啟動智慧抽題測驗</button>
                                        </div>
                                    )}
                                </div>
                            </main>
                        </div>
                    )}

                    {}
                    {isPrinting && (view === 'exam' || view === 'result') && (
                        <div className="bg-white w-full p-6 text-black min-h-screen print:p-0 print:m-0">
                            <h1 className="text-2xl font-black text-center mb-6 pb-4 border-b-2 border-black">
                                {selectedYear} - {selectedSubject.name} {isReviewMode ? '(附解答解析)' : ''}
                            </h1>
                            {['mcq', 'comprehensive', 'non_mcq', 'writing'].map(type => {
                                const qs = examData.filter(q => q.type === type);
                                if (qs.length === 0) return null;
                                const typeNames = { mcq: '選擇題', comprehensive: '綜合題', non_mcq: '非選擇題', writing: '寫作題' };
                                return (
                                    <div key={type} className="mb-8">
                                        <h2 className="text-lg font-bold mb-4 bg-gray-100 p-2 border-l-4 border-black">{typeNames[type]}</h2>
                                        {qs.map((q, idx) => {
                                            let showBlock = false;
                                            let showGroup = false;
                                            if (hasRealContent(q.block)) {
                                                showBlock = idx === 0 || q.block !== qs[idx-1]?.block;
                                            }
                                            if (hasRealContent(q.group)) {
                                                showGroup = idx === 0 || q.group !== qs[idx-1]?.group;
                                            }
                                            return <QuestionContent key={q.id} q={q} idx={idx + 1} isReviewMode={isReviewMode} answers={answers} setAnswers={()=>{}} markedQuestions={{}} toggleMark={()=>{}} showBlock={showBlock} showGroup={showGroup} />
                                        })}
                                    </div>
                                )
                            })}
                        </div>
                    )}

                    {}
                    {!isPrinting && (view === 'exam' || view === 'result') && (() => {
                        const mcqQuestions = examData.filter(q => q.type === 'mcq');
                        const nonMcqQuestions = examData.filter(q => q.type === 'non_mcq');
                        const compQuestions = examData.filter(q => q.type === 'comprehensive');
                        const writingQuestions = examData.filter(q => q.type === 'writing');

                        const TOTAL_PAGES = Math.max(1, Math.ceil(mcqQuestions.length / ITEMS_PER_MCQ_PAGE));
                        const validCurrentPage = Math.min(currentPage, TOTAL_PAGES);

                        let currentQuestions = [];
                        if (currentTab === 'mcq') currentQuestions = mcqQuestions.slice((validCurrentPage - 1) * ITEMS_PER_MCQ_PAGE, validCurrentPage * ITEMS_PER_MCQ_PAGE);
                        else if (currentTab === 'non_mcq') currentQuestions = nonMcqQuestions;
                        else if (currentTab === 'comprehensive') currentQuestions = compQuestions;
                        else if (currentTab === 'writing') currentQuestions = writingQuestions;

                        const isOnlyWrong = isReviewMode && currentTab === 'wrong';
                        if (isOnlyWrong) {
                            currentQuestions = examData.filter(q => markedQuestions[q.id] || (q.options?.length > 0 && answers[q.id] !== q.answer));
                        }

                        const mcqsAndCompsWithOptions = examData.filter(q => q.type === 'mcq' || (q.type === 'comprehensive' && q.options && q.options.length > 0));

                        // 🚀 雙頁碼元件
                        const paginationBlock = (!isOnlyWrong && currentTab === 'mcq' && TOTAL_PAGES > 1) ? (
                            <div className="flex justify-center gap-2 flex-wrap">
                                {Array.from({length: TOTAL_PAGES}).map((_, i) => (
                                    <button key={i} onClick={() => { setCurrentPage(i + 1); topRef.current.scrollIntoView({behavior: 'smooth'}); }} 
                                        className={`w-12 h-12 rounded-full font-black transition-all shadow-sm ${currentPage === i + 1 ? 'bg-amber-600 text-white scale-110' : 'bg-white/90 text-stone-500 hover:bg-stone-100'}`}>
                                        {i + 1}
                                    </button>
                                ))}
                            </div>
                        ) : null;

                        return (
                            <div className="flex-grow flex flex-col relative pb-24 pt-16 md:pt-0">
                                {!isReviewMode && (
                                    <div className={`fixed top-4 right-4 z-[250] px-5 py-2.5 rounded-full shadow-lg backdrop-blur-md font-black tracking-widest border-2 transition-all flex items-center gap-2 ${timeLeft <= 600 ? 'bg-rose-50 text-rose-600 border-rose-300 animate-pulse' : 'bg-white text-amber-900 border-amber-200'}`}>
                                        <span className="text-xl">⏱️</span> {Math.floor(timeLeft / 60).toString().padStart(2, '0')}:{(timeLeft % 60).toString().padStart(2, '0')}
                                    </div>
                                )}

                                <header className="sticky top-0 z-[200] p-3 flex flex-col md:flex-row justify-between items-center relative gap-2 bg-white/70 backdrop-blur-md border-b border-stone-200 shadow-sm pl-20 md:pl-36">
                                    <div className="flex items-center gap-3 shrink-0">
                                        <button onClick={() => {setView('years'); setYearMode('single');}} className="bg-[#543b24]/80 hover:bg-[#3d2918] px-4 py-2 rounded-lg font-bold text-sm text-white shadow-sm hidden md:block">◀ 離開</button>
                                    </div>
                                    <div className="absolute left-1/2 transform -translate-x-1/2 font-black text-sm md:text-lg text-amber-900 bg-amber-100/90 rounded-full px-6 py-2 shadow-md whitespace-nowrap">
                                        📌 {selectedYear} - {selectedSubject.name}
                                    </div>
                                    <div className="flex items-center gap-3">
                                        {view === 'exam' && <span className="font-black bg-stone-800/80 text-white px-3 py-1 md:px-4 rounded-full shadow-inner text-xs md:text-sm shrink-0 backdrop-blur-sm hidden md:block">選擇題 {validCurrentPage}/{TOTAL_PAGES} 頁</span>}
                                        <button onClick={handlePrint} className="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded-lg font-black flex items-center gap-2 shadow-lg text-sm mr-2 md:mr-16 transition-all hover:scale-105">🖨️ 列印考卷</button>
                                    </div>
                                </header>

                                <main className="max-w-5xl mx-auto px-4 mt-6 w-full relative z-10" ref={topRef}>
                                    {isReviewMode && (
                                        <div className="bg-glass p-6 md:p-8 rounded-3xl soft-shadow mb-8 text-center border-t-4 border-emerald-500">
                                            <h2 className="text-2xl font-black text-stone-800 mb-2">測驗結束</h2>
                                            <div className="text-5xl font-black text-emerald-600 my-4 flex items-center justify-center gap-2">
                                                {Math.round((mcqsAndCompsWithOptions.filter(q => answers[q.id] === q.answer).length / (mcqsAndCompsWithOptions.length || 1)) * 100) || 0}
                                                <span className="text-2xl text-stone-400">分</span>
                                            </div>
                                            <p className="text-stone-500 font-bold">選擇/綜合(有選項)答對：{mcqsAndCompsWithOptions.filter(q => answers[q.id] === q.answer).length} / {mcqsAndCompsWithOptions.length}</p>
                                        </div>
                                    )}

                                    <div className="bg-glass p-2 rounded-2xl soft-shadow mb-8 flex gap-2 overflow-x-auto hide-scrollbar border border-white">
                                        {isReviewMode && <button onClick={() => setCurrentTab('wrong')} className={`shrink-0 px-6 py-3 rounded-xl font-black text-sm transition-colors ${currentTab === 'wrong' ? 'bg-rose-500 text-white' : 'text-rose-600 hover:bg-rose-50'}`}>🔍 錯題本與標記</button>}
                                        {mcqQuestions.length > 0 && <button onClick={() => {setCurrentTab('mcq'); setCurrentPage(1);}} className={`shrink-0 px-6 py-3 rounded-xl font-black text-sm transition-colors ${currentTab === 'mcq' ? 'bg-amber-500 text-white' : 'text-stone-600 hover:bg-stone-50'}`}>選擇題 ({mcqQuestions.length})</button>}
                                        {compQuestions.length > 0 && <button onClick={() => setCurrentTab('comprehensive')} className={`shrink-0 px-6 py-3 rounded-xl font-black text-sm transition-colors ${currentTab === 'comprehensive' ? 'bg-amber-500 text-white' : 'text-stone-600 hover:bg-stone-50'}`}>綜合題 ({compQuestions.length})</button>}
                                        {nonMcqQuestions.length > 0 && <button onClick={() => setCurrentTab('non_mcq')} className={`shrink-0 px-6 py-3 rounded-xl font-black text-sm transition-colors ${currentTab === 'non_mcq' ? 'bg-amber-500 text-white' : 'text-stone-600 hover:bg-stone-50'}`}>非選擇題 ({nonMcqQuestions.length})</button>}
                                        {writingQuestions.length > 0 && <button onClick={() => setCurrentTab('writing')} className={`shrink-0 px-6 py-3 rounded-xl font-black text-sm transition-colors ${currentTab === 'writing' ? 'bg-purple-600 text-white' : 'text-stone-600 hover:bg-stone-50'}`}>✍️ 寫作題 ({writingQuestions.length})</button>}
                                    </div>

                                    <div className="bg-glass p-6 md:p-10 rounded-3xl soft-shadow border border-white">
                                        {/* 🚀 頂部頁碼區 */}
                                        {paginationBlock && <div className="mb-8">{paginationBlock}</div>}

                                        {currentQuestions.length === 0 ? (
                                            <div className="text-center py-12 text-stone-400 font-bold">本區塊尚無題目。</div>
                                        ) : (
                                            currentQuestions.map((q, idx) => {
                                                let displayIdx = idx + 1;
                                                let globalIdx = idx;
                                                
                                                if (currentTab === 'mcq' && !isOnlyWrong) {
                                                    globalIdx = (validCurrentPage - 1) * ITEMS_PER_MCQ_PAGE + idx;
                                                    displayIdx = globalIdx + 1;
                                                }

                                                let showBlock = false;
                                                let showGroup = false;

                                                if (hasRealContent(q.block)) {
                                                    if (idx === 0) {
                                                        showBlock = true;
                                                    } else if (currentTab === 'mcq' && !isOnlyWrong) {
                                                        showBlock = q.block !== mcqQuestions[globalIdx - 1]?.block;
                                                    } else {
                                                        showBlock = q.block !== currentQuestions[idx - 1]?.block;
                                                    }
                                                }

                                                if (hasRealContent(q.group)) {
                                                    if (idx === 0) {
                                                        showGroup = true;
                                                    } else if (currentTab === 'mcq' && !isOnlyWrong) {
                                                        showGroup = q.group !== mcqQuestions[globalIdx - 1]?.group;
                                                    } else {
                                                        showGroup = q.group !== currentQuestions[idx - 1]?.group;
                                                    }
                                                }

                                                return <QuestionContent key={q.id} q={q} idx={displayIdx} showBlock={showBlock} showGroup={showGroup} isReviewMode={isReviewMode} answers={answers} setAnswers={setAnswers} markedQuestions={markedQuestions} toggleMark={toggleMark} />;
                                            })
                                        )}
                                    </div>

                                    {/* 🚀 底部頁碼區 */}
                                    {paginationBlock && <div className="mt-8">{paginationBlock}</div>}

                                    {!isReviewMode && (
                                        <div className="mt-12 text-center pb-8">
                                            <button onClick={submitExam} className="bg-stone-800 hover:bg-stone-900 text-white px-12 py-4 rounded-2xl font-black text-lg shadow-xl hover:-translate-y-1 transition-all">📝 完成作答，送出交卷</button>
                                        </div>
                                    )}
                                </main>
                            </div>
                        );
                    })()}

                    {view === 'admin' && <AdminPanel setView={setView} firestoreDb={firestoreDb} stats={stats} setStats={setStats} onLogout={handleLogout} />}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
